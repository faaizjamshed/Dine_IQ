<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DineIQ Analytics — Restaurant Intelligence Command Centre. Big-data analytics and machine-learning insights for multi-outlet restaurant operations."
    />
    <meta name="theme-color" content="#0B1020" />
    <title>DineIQ Analytics — Restaurant Intelligence Command Centre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Theme boot: apply persisted theme before first paint to avoid a flash.
      // The command-centre dark theme is the default.
      try {
        var t = localStorage.getItem('dineiq.theme')
        if (t === 'light') document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
